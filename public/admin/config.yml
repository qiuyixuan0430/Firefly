# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.172.4/schema/sveltia-cms.json

backend:
  name: github
  repo: qiuyixuan0430/Firefly
  branch: master

publish_mode: simple
site_url: https://20040430.xyz
display_url: https://20040430.xyz

# 新上传图片放在 public 目录，文章封面与正文都能使用稳定的绝对地址。
# 现有的 src/content/posts/images 不会移动，也不会受到影响。
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: posts
    label: 文章管理
    label_singular: 文章
    description: 像使用 Word 一样编辑图文，发布后自动提交到 GitHub 并触发网站部署。
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} · {{published}}"
    sortable_fields:
      fields: [published, updated, title, category]
      default:
        field: published
        direction: descending
    view_filters:
      - label: 草稿
        field: draft
        pattern: true
      - label: 已置顶
        field: pinned
        pattern: true
    editor:
      preview: true
    fields:
      - label: 标题
        name: title
        widget: string
        required: true

      - label: 发布日期
        name: published
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
        required: true

      - label: 更新日期
        name: updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false

      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 显示在首页文章卡片上，建议填写一到两句话。

      - label: 文章封面
        name: image
        widget: image
        required: false
        choose_url: true
        hint: 可以上传图片，也可以粘贴网络图片地址。

      - label: 分类
        name: category
        widget: string
        required: false

      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
        field:
          label: 标签
          name: tag
          widget: string

      - label: 保存为草稿
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 开启后文章会保存到 GitHub，但不会显示在博客前台。

      - label: 置顶文章
        name: pinned
        widget: boolean
        default: false
        required: false

      - label: 开启评论
        name: comment
        widget: boolean
        default: true
        required: false

      - label: 作者
        name: author
        widget: string
        required: false

      - label: 文章语言
        name: lang
        widget: string
        required: false
        hint: 中文文章通常留空；需要时可填写 zh-CN、en 等。

      - label: 来源链接
        name: sourceLink
        widget: string
        required: false

      - label: 许可证名称
        name: licenseName
        widget: string
        required: false

      - label: 许可证链接
        name: licenseUrl
        widget: string
        required: false

      - label: 阅读密码
        name: password
        widget: string
        required: false

      - label: 密码提示
        name: passwordHint
        widget: string
        required: false

      - label: 正文
        name: body
        widget: richtext
        required: true
        hint: 普通排版和图片继续使用原工具栏；颜色、荧光、字体、字号、对齐和首行缩进请点击“高级文字”按钮。
